# BFF Student Gateway — Helm values for universal-service chart (prod)
# Student-facing BFF: proxies student requests to backend bounded contexts
global:
  environment: prod

image:
  repository: harbor.adapstory.com/adapstory/bff-student
  name: bff-student
  tag: "0.0.1"   # updated by CI on each deploy
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: harbor-registry

# HPA minReplicas=2 mandatory in prod (CLAUDE.md)
replicas: 0

remoteComputeScheduling:
  enabled: true
  preferredSites:
    - home-laptop
    - cloud
  weight: 90

terminationGracePeriodSeconds: 35

service:
  ports:
    - name: http
      port: 8080
      targetPort: 8080

ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - student-api.adapstory.com
    - adapstory.com
    - adapstory.ru
  paths:
    - path: /web-api/adapstory/student
      pathType: Prefix
  tls: true
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

# PDB mandatory in prod (CLAUDE.md)
pdb:
  enabled: true
  minAvailable: 1

lifecycle:
  preStop:
    exec:
      command: ["sleep", "5"]

serviceMonitor:
  enabled: true
  path: /actuator/prometheus
  interval: 30s

prometheusRule:
  enabled: true

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 20
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10

startupProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 5
  failureThreshold: 30

extraEnv:
  # ── JVM tuning: ZGC + tiny heap + virtual threads ──
  - name: JAVA_TOOL_OPTIONS
    value: "-XX:+UseZGC -XX:+ZGenerational -Xms128m -Xmx256m -Xss512k -XX:MaxMetaspaceSize=192m -XX:ReservedCodeCacheSize=48m -XX:MaxDirectMemorySize=32m -XX:ActiveProcessorCount=2 -XX:+ExitOnOutOfMemoryError"
  - name: SPRING_THREADS_VIRTUAL_ENABLED
    value: "true"
  - name: SPRING_PROFILES_ACTIVE
    value: "prod"
  - name: SERVER_PORT
    value: "8080"
  - name: SERVER_MAX_HTTP_REQUEST_HEADER_SIZE
    value: "32KB"
  - name: SERVER_FORWARD_HEADERS_STRATEGY
    value: "FRAMEWORK"
  # OAuth2 redirect URI
  - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_REDIRECT_URI
    value: "{baseUrl}/web-api/adapstory/student/v1/auth/callback/keycloak"
  # Downstream BC URLs (in-cluster DNS, env-prod namespace)
  - name: ADAPSTORY_BFF_STUDENT_DOWNSTREAM_IDENTITY_URL
    value: "http://prod-identity-service-svc.env-prod.svc.cluster.local:8082"
  - name: ADAPSTORY_BFF_STUDENT_DOWNSTREAM_CATALOG_URL
    value: "http://prod-dme-svc.env-prod.svc.cluster.local:8081"
  - name: ADAPSTORY_BFF_STUDENT_DOWNSTREAM_CONTENT_URL
    value: "http://prod-plugin-lifecycle-svc.env-prod.svc.cluster.local:8083"
  # Post-login redirect
  - name: ADAPSTORY_BFF_STUDENT_OAUTH2_WEB_POST_LOGIN_REDIRECT
    value: "/portal/home"
  # Mock mode: all disabled in prod (real services only)
  - name: ADAPSTORY_BFF_STUDENT_MOCK_MODE_ENABLED
    value: "false"
  # CORS
  - name: ADAPSTORY_BFF_STUDENT_CORS_ALLOWED_ORIGINS_0
    value: "https://adapstory.com"
  - name: ADAPSTORY_BFF_STUDENT_CORS_ALLOWED_ORIGINS_1
    value: "https://adapstory.ru"
  # Keycloak OAuth2 — external URL for browser, internal for server-side calls
  - name: KEYCLOAK_ISSUER_URI
    value: "https://auth.adapstory.com/realms/adapstory"
  - name: KEYCLOAK_AUTHORIZATION_URI
    value: "https://auth.adapstory.com/realms/adapstory/protocol/openid-connect/auth"
  - name: KEYCLOAK_TOKEN_URI
    value: "http://prod-keycloak-svc.env-prod.svc.cluster.local:8080/realms/adapstory/protocol/openid-connect/token"
  - name: KEYCLOAK_JWK_SET_URI
    value: "http://prod-keycloak-svc.env-prod.svc.cluster.local:8080/realms/adapstory/protocol/openid-connect/certs"
  - name: KEYCLOAK_USER_INFO_URI
    value: "http://prod-keycloak-svc.env-prod.svc.cluster.local:8080/realms/adapstory/protocol/openid-connect/userinfo"
  - name: KEYCLOAK_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: adapstory-bff-student-keycloak-client
        key: client-secret
  # Keycloak JWKS for JWT validation
  - name: AUTHENTICATION_WEB_CLIENT_OIDC_SIGMA_HOST
    value: "http://prod-keycloak-svc.env-prod.svc.cluster.local:8080/realms/adapstory"
  - name: AUTHENTICATION_WEB_CLIENT_OIDC_SIGMA_PATH
    value: "/protocol/openid-connect/certs"
  - name: AUTHENTICATION_WEB_CLIENT_OIDC_ISSUERS_0
    value: "https://auth.adapstory.com/realms/adapstory"
  - name: AUTHENTICATION_WEB_CLIENT_OIDC_AUDIENCES_0
    value: "adapstory-api"
  # Redis for distributed session store (OAuth2 state survives pod restarts)
  - name: SPRING_DATA_REDIS_HOST
    value: "redis-prod-master.env-prod.svc.cluster.local"
  - name: SPRING_DATA_REDIS_PORT
    value: "6380"
  # OTel
  - name: OTEL_SERVICE_NAME
    value: "adapstory-bff-student"
  - name: ADAPSTORY_MONITORING_TRACING_ENABLED
    value: "true"
  - name: ADAPSTORY_MONITORING_TRACING_ENDPOINT
    value: "http://prod-opentelemetry-collector.env-prod.svc.cluster.local:4317"
  - name: ADAPSTORY_MONITORING_TRACING_PROTOCOL
    value: "grpc"
  - name: ADAPSTORY_MONITORING_OTLP_ENABLED
    value: "true"
  - name: ADAPSTORY_MONITORING_OTLP_ENDPOINT
    value: "http://prod-opentelemetry-collector.env-prod.svc.cluster.local:4318/v1/metrics"
  - name: ADAPSTORY_MONITORING_OTLP_STEP_SECONDS
    value: "60"
